events {}

http {

    # hide nginx version from responses
    server_tokens off;

    upstream app_backend {
        server app:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *

ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /etc/mail_config/certs/mail.crt
ssl_server_key_file = /etc/mail_config/certs/mail.key

mail_driver = maildir
mail_path = ~/Maildir

auth_mechanisms = plain login
auth_allow_cleartext = no

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
  }
  user = root
}

service auth-worker {
  user = root
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
auth_verbose = yes
auth_debug_passwords = no
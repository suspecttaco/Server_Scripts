[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:setup]
command=/setup/entrypoint.sh
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/var/log/supervisor/setup.log
stderr_logfile=/var/log/supervisor/setup.log

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/rsyslog.log
stderr_logfile=/var/log/supervisor/rsyslog.log

[program:postfix]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && /usr/sbin/postfix start-fg"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postfix.log
stderr_logfile=/var/log/supervisor/postfix.log

[program:dovecot]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && /usr/sbin/dovecot -F"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/dovecot.log
stderr_logfile=/var/log/supervisor/dovecot.log

[program:spamassassin]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && spamd -d -c -m 5 -H"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/spamassassin.log
stderr_logfile=/var/log/supervisor/spamassassin.log

[program:opendkim]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && /usr/sbin/opendkim -f"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/opendkim.log
stderr_logfile=/var/log/supervisor/opendkim.log

[program:fail2ban]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && /usr/sbin/fail2ban-server -f -x"
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/fail2ban.log
stderr_logfile=/var/log/supervisor/fail2ban.log

[program:crond]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && /usr/sbin/crond -n"
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/crond.log
stderr_logfile=/var/log/supervisor/crond.log
[program:admin]
command=/bin/bash -c "while [ ! -f /tmp/setup_done ]; do sleep 1; done && node /admin/server.js"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/admin.log
stderr_logfile=/var/log/supervisor/admin.log